name: IncidentPulse CI/CD Quality Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Linting, Formatting, & Static Typing
  # -------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Typecheck (API & Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npx prettier --check "apps/**/*.{ts,tsx,js,json,md}"

      - name: Run ESLint
        run: npm run lint --workspaces --if-present

      - name: Typecheck Backend API
        run: npm run typecheck --workspace=apps/api --if-present

      - name: Typecheck Web Frontend
        run: |
          if [ -d "apps/web" ]; then
            npm run typecheck --workspace=apps/web --if-present
          else
            echo "apps/web not scaffolded yet (Phase 2), skipping."
          fi

  # -------------------------------------------------------------
  # Job 2: Backend Integration Tests with DB Services
  # -------------------------------------------------------------
  test-api:
    name: Backend Tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: incident_pulse
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: incident_pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident_pulse -d incident_pulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://incident_pulse:test_password@localhost:5432/incident_pulse_test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "ci_testing_jwt_secret_key_1234567890"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Migrations
        run: |
          if [ -f "apps/api/prisma/schema.prisma" ]; then
            npm run db:migrate:test --workspace=apps/api --if-present
          else
            echo "Prisma schema not created yet (Unit 02), skipping."
          fi

      - name: Execute API Tests
        run: npm run test --workspace=apps/api --if-present

  # -------------------------------------------------------------
  # Job 3: Next.js Production Build Verification
  # -------------------------------------------------------------
  build-web:
    name: Production Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Application
        run: |
          if [ -d "apps/web" ]; then
            npm run build --workspace=apps/web --if-present
          else
            echo "apps/web not scaffolded yet (Phase 2), skipping."
          fi
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:5000"

  # -------------------------------------------------------------
  # Job 4: Flutter Mobile Quality Gate
  # -------------------------------------------------------------
  analyze-mobile:
    name: Flutter Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ./apps/mobile
        run: flutter pub get
        continue-on-error: true

      - name: Verify Dart Formatting
        working-directory: ./apps/mobile
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      - name: Run Flutter Static Analysis
        working-directory: ./apps/mobile
        run: flutter analyze
        continue-on-error: true
