name: IncidentPulse CI/CD Quality Gate

on:
  push:
    branches: [main, master, develop, "feat/**", "fix/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Linting, Formatting, & Static Typing
  # -------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Typecheck (Monorepo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:shared --if-present

      - name: Generate Prisma Client
        run: |
          if [ -f "apps/api/prisma/schema.prisma" ]; then
            npx prisma generate --schema=apps/api/prisma/schema.prisma
          fi

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck TypeScript Workspaces
        run: npm run typecheck

  # -------------------------------------------------------------
  # Job 2: Backend Integration Tests with DB Services
  # -------------------------------------------------------------
  test-api:
    name: Backend Tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: incident_pulse
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: incident_pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident_pulse -d incident_pulse_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://incident_pulse:test_password@localhost:5432/incident_pulse_test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "ci_testing_jwt_secret_key_1234567890"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:shared --if-present

      - name: Generate Prisma Client
        run: |
          if [ -f "apps/api/prisma/schema.prisma" ]; then
            npx prisma generate --schema=apps/api/prisma/schema.prisma
          fi

      - name: Run Prisma Schema Push
        run: |
          if [ -f "apps/api/prisma/schema.prisma" ]; then
            npm run db:migrate:test --workspace=apps/api
          fi

      - name: Execute API Integration Tests (70 tests)
        run: npm run test --workspace=apps/api

  # -------------------------------------------------------------
  # Job 3: Next.js Production Build Verification
  # -------------------------------------------------------------
  build-web:
    name: Production Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:shared --if-present

      - name: Build Next.js Application
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:5000"

  # -------------------------------------------------------------
  # Job 4: Flutter Mobile Quality Gate
  # -------------------------------------------------------------
  mobile-quality-gate:
    name: Flutter Mobile Quality Gate (Analyze & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ./apps/mobile
        run: flutter pub get

      - name: Verify Dart Formatting
        working-directory: ./apps/mobile
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Flutter Static Analysis
        working-directory: ./apps/mobile
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        working-directory: ./apps/mobile
        run: flutter test

  # -------------------------------------------------------------
  # Job 5: Unified CI Completion Gate (Branch Protection Check)
  # -------------------------------------------------------------
  ci-success:
    name: All CI Quality Gates Passed
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-api, build-web, mobile-quality-gate]
    if: always()
    steps:
      - name: Evaluate Matrix Status
        run: |
          if [ "${{ needs.lint-and-typecheck.result }}" != "success" ] || \
             [ "${{ needs.test-api.result }}" != "success" ] || \
             [ "${{ needs.build-web.result }}" != "success" ] || \
             [ "${{ needs.mobile-quality-gate.result }}" != "success" ]; then
            echo "::error::One or more required CI quality gates failed!"
            echo "lint-and-typecheck: ${{ needs.lint-and-typecheck.result }}"
            echo "test-api: ${{ needs.test-api.result }}"
            echo "build-web: ${{ needs.build-web.result }}"
            echo "mobile-quality-gate: ${{ needs.mobile-quality-gate.result }}"
            exit 1
          fi
          echo "All monorepo CI/CD quality gates passed successfully!"
